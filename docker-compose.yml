services:
  redis:
    image: redis:7-alpine
    container_name: risk-lab-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M

  php-swoole:
    build: ./php-swoole
    container_name: risk-lab-php-swoole
    environment:
      HOST: 0.0.0.0
      PORT: 9501
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SWOOLE_WORKERS: 4
    ports:
      - "9501:9501"
    depends_on:
      redis:
        condition: service_healthy
    # Recursos IDÊNTICOS ao serviço kotlin-coroutines: é o que torna a
    # comparação de performance justa.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M

  kotlin-coroutines:
    build: ./kotlin-coroutines
    container_name: risk-lab-kotlin
    environment:
      PORT: 9502
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JAVA_TOOL_OPTIONS: "-Xmx384m"
    ports:
      - "9502:9502"
    depends_on:
      redis:
        condition: service_healthy
    # Recursos IDÊNTICOS ao serviço php-swoole: é o que torna a
    # comparação de performance justa.
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 512M

networks:
  default:
    name: risk-lab-net
